name: DevOps Dashboard PRO - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================
# GitHub Actions Permissions
# ==========================================

permissions:
  contents: read
  packages: write


jobs:

  test-and-build:

    name: Test and Build Docker Image

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ==========================================
      # 3. Install Dependencies
      # ==========================================

      - name: Install dependencies
        run: npm ci


      # ==========================================
      # 4. Run Tests
      # ==========================================

      - name: Run tests
        run: npm test


      # ==========================================
      # 5. Login to GitHub Container Registry
      # ==========================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # 6. Build Docker Image
      # ==========================================

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devops-dashboard-pro:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-dashboard-pro:latest \
            .


      # ==========================================
      # 7. Push Docker Image to GHCR
      # ==========================================

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-dashboard-pro:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-dashboard-pro:latest


      # ==========================================
      # 8. Verify Docker Images
      # ==========================================

      - name: Verify Docker images
        run: |
          docker images
